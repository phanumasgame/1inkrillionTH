<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071322">
  <meta name="description" content="7 คำถาม คำตอบที่คาดไม่ถึง และทะเลแห่งความรู้ — เกมคำตอบหายากฉบับไทย">
  <title>Krillion TH · the daily dive</title>
  <link rel="icon" href="/assets/art/krillion.png" type="image/png">
  <link rel="preload" href="/assets/fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="/styles.css?v=1.0.8">

<body>
  <div id="world" aria-hidden="true">
